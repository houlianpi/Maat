<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Maat Dashboard</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px/1.45 system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--color-text-primary, #e7f0f2);
        background: var(--color-background-primary, #0b1e24);
      }
      main {
        min-height: 100vh;
        padding: 20px;
        background: radial-gradient(circle at top right, #174452 0, transparent 38%);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0.04em;
      }
      .mark {
        color: #79e0bd;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      button {
        border: 1px solid #46616a;
        border-radius: 9px;
        padding: 7px 10px;
        color: inherit;
        background: #17313a;
        cursor: pointer;
      }
      button:hover {
        background: #20434d;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .card {
        min-width: 0;
        padding: 14px;
        border: 1px solid #294650;
        border-radius: 14px;
        background: color-mix(in srgb, #102a32 88%, transparent);
      }
      .wide {
        grid-column: 1 / -1;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 12px;
        color: #91abb3;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .value {
        font-size: 18px;
        font-weight: 650;
        overflow-wrap: anywhere;
      }
      .muted {
        color: #91abb3;
      }
      .ok {
        color: #79e0bd;
      }
      .bad {
        color: #ff948c;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 10px;
        margin: 0;
      }
      dt {
        color: #91abb3;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
      }
      li {
        padding: 8px 10px;
        border-radius: 9px;
        background: #142d35;
        overflow-wrap: anywhere;
      }
      .evidence-row {
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 10px;
        align-items: center;
      }
      .thumb {
        width: 72px;
        height: 52px;
        border: 1px solid #294650;
        border-radius: 7px;
        object-fit: cover;
        background: #09171c;
      }
      .empty {
        color: #91abb3;
        font-style: italic;
      }
      footer {
        margin-top: 14px;
        color: #78919a;
        font-size: 12px;
      }
      @media (max-width: 520px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .wide {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1><span class="mark">⚖</span> Maat</h1>
        <div class="actions">
          <button id="refresh">Refresh</button><button id="stop">Stop exploration</button>
        </div>
      </header>
      <section class="grid">
        <article class="card">
          <h2>Platform</h2>
          <div id="platform" class="value">—</div>
          <div id="session" class="muted"></div>
        </article>
        <article class="card">
          <h2>Workspace</h2>
          <div id="workspace" class="value">—</div>
          <div id="root" class="muted"></div>
        </article>
        <article class="card wide">
          <h2>Case</h2>
          <div id="case" class="value">No active Case</div>
          <dl id="case-stats"></dl>
        </article>
        <article class="card wide">
          <h2>Evidence</h2>
          <ul id="evidence">
            <li class="empty">No Evidence</li>
          </ul>
        </article>
        <article class="card wide">
          <h2>Latest run</h2>
          <div id="run" class="value">No completed run</div>
          <div id="report" class="muted"></div>
        </article>
      </section>
      <footer id="updated">Waiting for Dashboard state…</footer>
    </main>
    <script>
      let nextId = 1;
      const pending = new Map();
      let current;
      function request(method, params) {
        const id = nextId++;
        parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
      }
      function esc(value) {
        return String(value ?? '').replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
        );
      }
      function render(state) {
        current = state;
        document.querySelector('#platform').textContent = state?.platform?.label ?? '—';
        document.querySelector('#session').textContent = [
          state?.platform?.session,
          state?.platform?.detail,
        ]
          .filter(Boolean)
          .join(' · ');
        document.querySelector('#workspace').textContent = state?.workspace?.name ?? '—';
        document.querySelector('#root').textContent = state?.workspace?.root ?? '';
        document.querySelector('#case').textContent = state?.case
          ? state.case.name + ' · ' + state.case.id
          : 'No active Case';
        document.querySelector('#case-stats').innerHTML = state?.case
          ? `<dt>Steps</dt><dd>${state.case.steps}</dd><dt>Attempts</dt><dd>${state.case.attempts}</dd><dt>Objectives</dt><dd>${state.case.objectives}</dd>`
          : '';
        document.querySelector('#evidence').innerHTML = state?.evidence?.length
          ? state.evidence
              .map((e) => {
                const preview =
                  e.type === 'image' || /\.(?:png|jpe?g)$/i.test(e.path ?? '')
                    ? `<img class="thumb" data-evidence="${esc(e.id)}" alt="Evidence preview">`
                    : '';
                return `<li class="evidence-row"><div>${preview}</div><div>${esc(e.name ?? e.id)}<div class="muted">${esc(e.status ?? e.type ?? '')} ${esc(e.path ?? '')}</div></div></li>`;
              })
              .join('')
          : '<li class="empty">No Evidence</li>';
        document.querySelectorAll('[data-evidence]').forEach(async (imageElement) => {
          try {
            const preview = await request('tools/call', {
              name: 'maat_get_evidence_preview',
              arguments: { id: imageElement.dataset.evidence },
            });
            const image = preview?.content?.find((item) => item.type === 'image');
            if (image) imageElement.src = `data:${image.mimeType};base64,${image.data}`;
          } catch {}
        });
        const result = state?.latestRun?.result;
        document.querySelector('#run').textContent = result
          ? `${result.passed ? 'Passed' : 'Failed'} · ${result.tests?.length ?? 0} tests · ${result.failures ?? 0} failures`
          : 'No completed run';
        document.querySelector('#run').className =
          'value ' + (result ? (result.passed ? 'ok' : 'bad') : '');
        document.querySelector('#report').textContent = state?.reportPath ?? '';
        document.querySelector('#updated').textContent =
          'Updated ' + new Date().toLocaleTimeString();
      }
      async function call(name, args = {}) {
        const result = await request('tools/call', { name, arguments: args });
        if (result?.structuredContent) render(result.structuredContent);
        return result;
      }
      addEventListener('message', (event) => {
        if (event.source !== parent || event.data?.jsonrpc !== '2.0') return;
        const m = event.data;
        if (m.id !== undefined && pending.has(m.id)) {
          const p = pending.get(m.id);
          pending.delete(m.id);
          m.error ? p.reject(m.error) : p.resolve(m.result);
          return;
        }
        if (m.method === 'ui/notifications/tool-result' && m.params?.structuredContent)
          render(m.params.structuredContent);
      });
      document.querySelector('#refresh').onclick = () => call('maat_get_dashboard_state');
      document.querySelector('#stop').onclick = async () => {
        await call('maat_close_exploration');
        await call('maat_get_dashboard_state');
      };
      (async () => {
        await request('ui/initialize', {
          protocolVersion: '2025-06-18',
          clientInfo: { name: 'maat-dashboard', version: '0.3.1' },
          appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
        });
        parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/initialized' }, '*');
      })();
    </script>
  </body>
</html>
