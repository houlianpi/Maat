name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, unit, and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      MAAT_TEST_BROWSER: chromium
      FORCE_COLOR: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Project tests
        run: npm test

      - name: Playwright smoke suite
        run: npm run maat:test -- --suite smoke --project chromium --workers 2

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            artifacts/playwright/report
            artifacts/playwright/test-results
          if-no-files-found: ignore
          retention-days: 14
