name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  device-lock:
    name: Device lock (${{ matrix.os }}, Node 24)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify native package and arm64 prebuilds
        run: node -e "const fs=require('node:fs'); const p=require('fs-native-extensions'); if(typeof p.tryLock!=='function'||typeof p.unlock!=='function') process.exit(1); for(const f of ['darwin-arm64','linux-arm64','win32-arm64']) if(!fs.existsSync(require.resolve('fs-native-extensions').replace('index.js', 'prebuilds/'+f+'/fs-native-extensions.node'))) process.exit(1)"

      - name: Cross-process device lock tests
        run: node --experimental-strip-types --test test/device-lock.test.ts

  verify:
    name: Typecheck, unit, and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      MAAT_TEST_BROWSER: chromium
      FORCE_COLOR: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      - name: Project tests
        run: npm test

      - name: Verify npm package
        run: npm run package:check

      - name: Verify dependency boundaries
        run: |
          test -z "$(rg '@earendil-works/pi' packages/core/src || true)"
          test "$(node -p "require('./packages/pi/package.json').peerDependencies['@earendil-works/pi-coding-agent']")" = "*"
