name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, unit, and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      MAAT_TEST_BROWSER: chromium
      FORCE_COLOR: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      - name: Project tests
        run: npm test

      - name: Verify npm package
        run: npm run package:check

      - name: Verify dependency boundaries
        run: |
          test -z "$(rg '@earendil-works/pi' packages/core/src || true)"
          test "$(node -p "require('./packages/pi/package.json').peerDependencies['@earendil-works/pi-coding-agent']")" = "*"

      - name: Maat smoke suite
        run: npm run maat:test -- --root test/fixtures/maat-tests --project web --suite smoke --browser chromium --workers 2

      - name: Upload Maat report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maat-report-${{ github.run_attempt }}
          path: |
            artifacts/maat
          if-no-files-found: ignore
          retention-days: 14
