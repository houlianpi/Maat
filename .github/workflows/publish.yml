name: Publish npm package

on:
  release:
    types: [published]

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Require tag to match package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/core/package.json').version")
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "Release tag $RELEASE_TAG must equal v$PACKAGE_VERSION" >&2
            exit 1
          }
          test "$(node -p "require('./packages/pi/package.json').version")" = "$PACKAGE_VERSION"
          test "$(node -p "require('./packages/maat/package.json').version")" = "$PACKAGE_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify source
        run: |
          npm run format:check
          npm run typecheck
          npm test

      - name: Verify package contents
        run: npm run package:check

      - name: Publish Core with provenance
        run: npm publish --workspace @houlianpi/maat-core

      - name: Publish Pi Extension with provenance
        run: npm publish --workspace @houlianpi/maat-pi

      - name: Publish standalone Maat with provenance
        run: npm publish --workspace @houlianpi/maat
