name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    env:
      NPM_DIST_TAG: ${{ (github.event_name == 'workflow_dispatch' || github.event.release.prerelease) && 'next' || 'latest' }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Require tag to match package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/core/package.json').version")
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "Release tag $RELEASE_TAG must equal v$PACKAGE_VERSION" >&2
            exit 1
          }
          test "$(node -p "require('./packages/pi/package.json').version")" = "$PACKAGE_VERSION"
          test "$(node -p "require('./packages/maat/package.json').version")" = "$PACKAGE_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify source
        run: |
          npm run format:check
          npm run typecheck
          npm test

      - name: Verify package contents
        run: npm run package:check

      - name: Record current npm channels
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import path from 'node:path';
          const packages = ['@houlianpi/maat-core', '@houlianpi/maat-pi', '@houlianpi/maat'];
          const channels = Object.fromEntries(packages.map((name) => [
            name,
            JSON.parse(execFileSync('npm', ['view', name, 'dist-tags', '--json'], { encoding: 'utf8' })),
          ]));
          writeFileSync(path.join(process.env.RUNNER_TEMP, 'maat-npm-channels.json'), JSON.stringify(channels));
          console.log(JSON.stringify(channels));
          NODE

      - name: Publish Core with provenance
        if: github.event_name == 'release'
        run: npm publish --workspace @houlianpi/maat-core --tag "$NPM_DIST_TAG"

      - name: Publish Pi Extension with provenance
        if: github.event_name == 'release'
        run: npm publish --workspace @houlianpi/maat-pi --tag "$NPM_DIST_TAG"

      - name: Publish standalone Maat with provenance
        if: github.event_name == 'release'
        run: npm publish --workspace @houlianpi/maat --tag "$NPM_DIST_TAG"

      - name: Verify published npm channel
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          import { setTimeout as delay } from 'node:timers/promises';
          const before = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'maat-npm-channels.json'), 'utf8'));
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const deadline = Date.now() + 300_000;
          for (const name of Object.keys(before)) {
            let after;
            do {
              after = JSON.parse(execFileSync('npm', ['view', name, 'dist-tags', '--json', '--prefer-online', '--fetch-retries=0', '--fetch-timeout=15000'], { encoding: 'utf8', timeout: 20_000 }));
              if (process.env.NPM_DIST_TAG === 'next') {
                assert.equal(after.latest, before[name].latest, `${name}: prerelease changed latest`);
                assert.notEqual(after.latest, version, `${name}: preview became latest`);
              }
              if (after[process.env.NPM_DIST_TAG] === version) break;
              console.log(JSON.stringify({ package: name, waitingFor: version, channels: after }));
              if (Date.now() >= deadline) break;
              await delay(10_000);
            } while (Date.now() < deadline);
            assert.equal(after[process.env.NPM_DIST_TAG], version, `${name}: wrong release channel`);
            if (process.env.NPM_DIST_TAG === 'next')
              assert.equal(after.latest, before[name].latest, `${name}: prerelease changed latest`);
            console.log(JSON.stringify({ package: name, version, channels: after }));
          }
          NODE
